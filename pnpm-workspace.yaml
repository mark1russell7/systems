packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# A git-hosted package is approved by its repository URL, so a new commit of cue needs no new approval.
allowBuilds:
  "@mark1russell7/cue@git+https://github.com/mark1russell7/cue.git": true
  esbuild: true
  # Testcontainers reaches Docker through ssh2, which works without its optional native addon
  # (cpu-features). The script of protobufjs only checks a version. The harness needs none of them.
  cpu-features: false
  protobufjs: false
  ssh2: false

# @procedures/peer has @mark1russell7/service as a plain dependency. Without this override, pnpm gives the peer
# its own copy from npm, apart from the workspace link: two copies of the service in one process. CLI-117 of the
# client makes the service a peer dependency. When that client release is on npm, SYS-104 removes this override.
#
# Testcontainers gets archiver-utils 5.0.2 through archiver 7, and archiver-utils asks for glob ^10. A glob before
# 14.0.2 has CVE-2026-118773. Its minimatch 9 has CVE-2026-118764. The package archiver-utils uses only glob.sync,
# and glob 14 keeps that function.
#
# Archiver 8 does not fit: testcontainers uses the default export, and archiver 8 has none. When testcontainers
# moves to archiver 8, or archiver-utils accepts glob 14, this override goes.
overrides:
  "@mark1russell7/service": "workspace:*"
  "archiver-utils>glob": "^14.0.2"

minimumReleaseAgeExclude:
  # Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
  - "@mark1russell7/*"
  - "@procedures/*"
  - "@astrojs/starlight@0.42.6"
  - astro@7.3.8

# An install fails when a new version has less trust evidence than an earlier version of the same package: for
# example, a version with no provenance after versions from a trusted publisher. Such a version can be a stolen token.
trustPolicy: no-downgrade
# The check examines the versions of the last 7 days. A stolen-token version is new, and the registry removes it in
# hours. Older versions can have less evidence for other reasons: for example undici-types 6.21.0 under @types/node.
trustPolicyIgnoreAfter: 10080

# The release train updates our own scopes, and it checks the provenance of each version. pnpm cannot use them: it
# ranks the first versions, which were staged by hand, above the versions from release.yml (pnpm/pnpm#16689).
trustPolicyExclude:
  - "@mark1russell7/*"
  - "@procedures/*"
