# The configuration of LazyFS in the disk tier. The cache holds each write until an fsync, and it does
# not evict a page: thus lazyfs::clear-cache loses each write after the last fsync, and no other write.
[faults]
fifo_path="/run/lazyfs/faults.fifo"
fifo_path_completed="/run/lazyfs/done.fifo"

[cache]
apply_eviction=false

[cache.simple]
custom_size="1gb"
blocks_per_page=1

[filesystem]
log_all_operations=false
logfile=""
