# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/systems/, with the
# shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # A pull request builds the site and runs the site check, with no deploy.
  pull_request:
  # Every 3 hours, so that the Status page shows the open pull requests and issues of the day
  schedule:
    - cron: "28 */3 * * *"
  workflow_dispatch:

permissions: {}

# One deployment at a time. A deployment in progress ends, and GitHub keeps only the newest deployment that waits.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The site is an Astro site in packages/site.
      build: pnpm --filter @systems/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}", "ASTRO_TELEMETRY_DISABLED": "1"}'
      # The site-pages action adds releases/, status/, data/releases.json and data/status.json to the built site.
      # The Status page shows the items of docs/ROADMAP.md, and the open pull requests and issues.
      site-pages: true
      roadmap: docs/ROADMAP.md
      packages: "@mark1russell7/algebra,@mark1russell7/harness,@mark1russell7/kind,@mark1russell7/machines,@mark1russell7/prober,@mark1russell7/quantity,@mark1russell7/service"
      site-name: systems
      # The site check: a browser opens each page at 360, 400 and 1280 px, in light and dark, before the deploy.
      # A failure stops the deploy.
      site-check: true
      data-stamps: packages/site/dist/data-stamps.json
      site-check-pages: /,/releases/,/status/,/results/cells/
      # The probe drives the detection lab of the home page. The check reads the TypeScript source and removes its types.
      site-check-probe: packages/site/src/check-probe.ts
      deploy: ${{ github.event_name != 'pull_request' }}
