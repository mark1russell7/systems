# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/systems/.
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # Every 3 hours, so that the Status page shows the open pull requests and issues of now
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels a deployment that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build runs the code of the repository, so it gets only read permissions. The deploy job
    # keeps the Pages permissions of the workflow.
    permissions:
      contents: read
      # green-main reads the Actions runs. site-pages reads the pull requests, the issues and their checks.
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      # A scheduled build takes the newest commit of main, or the newest green one if CI failed on it
      - id: green
        if: github.event_name == 'schedule'
        uses: mark1russell7/template/.github/actions/green-main@7af3bb92e5d5d290cdfe066f2db9d4e3dcf50cdd # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.green.outputs.sha || github.sha }}
          # The whole history: site-pages reads the dates of the release tags
          fetch-depth: 0
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @systems/site run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          ASTRO_TELEMETRY_DISABLED: "1"
      # The Releases page and the Status page (releases/, status/ and their data/*.json), at deploy time
      - uses: mark1russell7/template/.github/actions/site-pages@7af3bb92e5d5d290cdfe066f2db9d4e3dcf50cdd # main
        with:
          out: packages/site/dist
          roadmap: docs/ROADMAP.md
          packages: "@mark1russell7/algebra,@mark1russell7/harness,@mark1russell7/kind,@mark1russell7/machines,@mark1russell7/prober,@mark1russell7/quantity,@mark1russell7/service"
          site-name: systems
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
