# Runs the opt-in tests of the ./http entry of @mark1russell7/service on real sockets of the
# loopback, on GitHub's runners. ci.yml runs the same parts on fake servers and the fake clock only.
#
#   http   HTTP_IT=1: the conformance kit of a transport on real sockets (the fake clock and the real
#          clock), keep-alive, the stop of the intake, the upgrades, the probe server, and a service
#          under run() after SIGTERM, the idle close of a large answer to a slow client
#          (idle-close.test.ts, SYS-33), and the GOAWAY of a server of HTTP/2 (http2-it.test.ts).
#          Each job of the matrix is one version of Node. Each one uploads its raw records
#          (HTTP_RECORDS) as an artifact.
#   units  WORKERS_IT=1: the conformance kit of the worker loop and of the queue drain on the real
#          clock. Their raw records (WORKERS_RECORDS) go in the same artifact.
#
# These tests measure time, thus they run only here, on a runner with no other load.
# A pull request that changes the service package or this file runs them.
# Start it with: gh workflow run http.yml -R mark1russell7/systems
name: HTTP

on:
  workflow_dispatch:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/http.yml"
      - "packages/service/**"

permissions:
  contents: read

concurrency:
  group: http-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
        with:
          paths: |
            .github/workflows/http.yml
            packages/service/**

  http:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: http (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        # the floor of "engines", the current LTS, and the version of ci.yml
        node: ["22.19", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The ./http entry on real sockets
        env:
          HTTP_IT: "1"
          HTTP_RECORDS: ${{ runner.temp }}/http-records
        run: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts src/http/http2-it.test.ts src/http/idle-close.test.ts --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/http-records/junit.xml"
      - name: The worker loop and the queue drain on the real clock
        if: always()
        env:
          WORKERS_IT: "1"
          WORKERS_RECORDS: ${{ runner.temp }}/http-records
        run: pnpm --filter @mark1russell7/service exec vitest run src/worker.test.ts src/queue.test.ts -t "on the real clock" --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/http-records/junit-units.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: http-records-node-${{ matrix.node }}
          path: ${{ runner.temp }}/http-records
          if-no-files-found: warn

  http-ok:
    name: HTTP OK
    if: ${{ !cancelled() }}
    needs: [changes, http]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
        with:
          needs: ${{ toJSON(needs) }}
