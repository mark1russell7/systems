# Starts the self-test of the disk tier of the harness (HARNESS_DISK=1) on GitHub's runners. The tier applies a disk
# plan of rigor-chaos to the files of a program on LazyFS: a power cut loses each write after the last fsync. Each fault
# has a new privileged container, because LazyFS needs /dev/fuse and a mount. Thus the tier operates only here.
#
# The job builds the shipped image lazyfs, applies each case of src/disk.test.ts, and uploads the record of each case
# (harness-disk/1) as the artifact disk-records. Each case holds its expected result as data, and the test compares it.
#
# A pull request that changes the disk tier or this file starts it. Start it by hand with:
#   gh workflow run disk.yml -R metrograph-labs/systems --ref <branch>
name: Disk

on:
  workflow_dispatch:
  # Each pull request starts this workflow. Thus the summary check of the gate is always present. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/disk.yml"
      - "packages/harness/src/disk.ts"
      - "packages/harness/src/disk.test.ts"
      - "packages/harness/src/disk-subject/**"
      - "packages/harness/image/lazyfs/**"

permissions:
  contents: read

# A pull request and a dispatch share a group with the later workflows of their ref. A later one cancels an earlier one. The queue
# dispatches this gate on each pull request that is behind main (SYS-118). A push to main cancels nothing.
concurrency:
  group: disk-${{ github.event_name != 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          paths: |
            .github/workflows/disk.yml
            packages/harness/src/disk.ts
            packages/harness/src/disk.test.ts
            packages/harness/src/disk-subject/**
            packages/harness/image/lazyfs/**

  disk:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image builds once in the step, and each case starts a new container of it
      - name: The self-test of the disk tier
        env:
          HARNESS_DISK: "1"
          HARNESS_DISK_OUT: ${{ runner.temp }}/disk-records
        run: pnpm --filter @mark1russell7/harness exec vitest run src/disk.test.ts
      - name: The records of the cases
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-records
          path: ${{ runner.temp }}/disk-records
          if-no-files-found: warn

  disk-ok:
    name: Disk OK
    if: ${{ !cancelled() }}
    needs: [changes, disk]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          needs: ${{ toJSON(needs) }}
