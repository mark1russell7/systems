# Makes the pnpm-lock.yaml of a pull request branch again, on a runner, when a merge of main conflicts in it.
# Start it on the branch of the pull request: fleet.mjs dispatch mark1russell7/systems lockfile.yml --ref <branch>.
# The steps after the run are in the header of the reusable workflow.
name: Lockfile

on:
  workflow_dispatch:

permissions: {}

# One run at a time on each branch: a second run waits for the first.
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    uses: mark1russell7/template/.github/workflows/reusable-lockfile.yml@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
    permissions:
      contents: read
