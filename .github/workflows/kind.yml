# Runs the kind catalogs, T07, T15 and T18, on GitHub's runners. Each shard gets a runner of its own,
# and each job makes its own kind clusters with the pinned kind and node image, then deletes them.
# A cell of T15 gets Istio 1.31.3 in its cluster, from the pinned istioctl and images pinned by digest.
#
#   plan    The shards: the input for a dispatch, one for a pull request.
#   kind    Writes what the runner is, and which kube-proxy modes its kernel can do. Then it runs
#           the cells whose names match `only` (KIND_LAB=1), a shard on each runner, and uploads each
#           raw record and summary.ndjson as an artifact. A cell of a mode that the kernel cannot do
#           waits, with its reason in summary.ndjson. An ambient cell waits the same way when a
#           module of istio-cni does not load.
#   capture Makes a cluster with the dataplane cilium, and dumps the services of the agent of each
#           node in three states of the backends (src/cilium.capture.test.ts). It uploads the dump as
#           the artifact cilium-capture. It starts on a pull request, and on a dispatch with capture=true.
#
# Start it with: gh workflow run kind.yml -R mark1russell7/systems --ref <branch> -f only='^T07' -f shards=10
# The shards keep the cells of one kube-proxy mode and one mesh flavor together (shardOf).
# A pull request that changes this file runs a smoke: the calibration of each mode, 2 runs, one cluster.
#
# The step The cells stops after `minutes` (36 by default), approximately 3 times the 12 min of a
# shard of the backlog cells. Thus a shard that does not end fails fast, and the job still uploads
# its records. A dispatch of a long catalog sets a larger bound, for example -f minutes=300.
#
# A runner has 4 CPUs and 16 GB. A cluster of one control plane and 2 workers idles at about 1.2 GB
# and a quarter of a CPU, thus each job makes one cluster at a time.
name: Kind

on:
  workflow_dispatch:
    inputs:
      only:
        description: A regular expression of the cell names to run
        default: "."
      shards:
        description: How many runners share the cells (1 to 20)
        default: "10"
      runs:
        description: The runs of each cell (empty for the count of the catalog)
        default: ""
      environments:
        description: How many new clusters each group of cells gets, in sequence
        default: "2"
      capture:
        description: Also capture the services of the agent of Cilium (true or false)
        default: "false"
      minutes:
        description: The bound of the step The cells on each runner, in minutes (5 to 330)
        default: "36"
  pull_request:
    paths: [".github/workflows/kind.yml"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - id: shards
        env:
          SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '1' }}
          MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '36' }}
        run: |
          case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a whole number"; exit 1 ;;
          esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be 1 to 20"; exit 1
          fi
          case "$MINUTES" in
            ''|*[!0-9]*) echo "::error::minutes must be a whole number"; exit 1 ;;
          esac
          if [ "$MINUTES" -lt 5 ] || [ "$MINUTES" -gt 330 ]; then
            echo "::error::minutes must be 5 to 330"; exit 1
          fi
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "list=$(seq -s, 0 $((SHARDS - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  kind:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      KIND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '^T07 (iptables|ipvs|nftables), the propagation' }}
      # an empty count of a dispatch keeps the count of the catalog
      KIND_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || (github.event_name != 'workflow_dispatch' && '2' || '') }}
      KIND_ENVIRONMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.environments || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner, beside the records
        run: |
          mkdir -p "$RUNNER_TEMP/kindcells"
          {
            echo "kernel: $(uname -r)"
            echo "CONFIG_HZ: $(grep -E '^CONFIG_HZ=' "/boot/config-$(uname -r)" || echo unknown)"
            echo "cpus: $(nproc)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MiB"
            echo "cgroup: $(stat -fc %T /sys/fs/cgroup)"
            echo "docker: $(docker version --format '{{.Server.Version}}')"
            echo "image: $ImageOS $ImageVersion"
          } | tee "$RUNNER_TEMP/kindcells/runner.txt"
      # kube-proxy in a node container uses the modules of the host kernel: load them here
      - name: The kube-proxy modes of this kernel
        run: |
          modes="iptables"
          waiting=""
          if sudo modprobe -a ip_vs ip_vs_rr ip_vs_wrr ip_vs_sh nf_conntrack; then
            modes="$modes,ipvs"
          else
            waiting="the kernel $(uname -r) of the runner has no ip_vs module for IPVS mode"
          fi
          if sudo modprobe nf_tables; then
            modes="$modes,nftables"
          else
            waiting="${waiting:+$waiting; }the kernel $(uname -r) of the runner has no nf_tables module"
          fi
          {
            echo "modes: $modes"
            echo "waiting: ${waiting:-none}"
            lsmod | grep -E '^(ip_vs|nf_tables|nf_conntrack|br_netfilter)' || true
          } | tee "$RUNNER_TEMP/kindcells/modes.txt"
          echo "KIND_MODES=$modes" >> "$GITHUB_ENV"
          echo "KIND_WAITING=$waiting" >> "$GITHUB_ENV"
      # The dataplane cilium: Cilium 1.20.4 replaces kube-proxy. Its socket LB in a kind node needs
      # cgroup v2, and a cgroup namespace for each node (Documentation/installation/kind.rst). kind
      # v0.33.0 gives each node a private cgroup namespace, thus this step examines only cgroup v2.
      - name: The Cilium dataplane of this runner
        run: |
          cgroup="$(stat -fc %T /sys/fs/cgroup)"
          docker_cgroup="$(docker info --format '{{.CgroupVersion}}')"
          if [ "$cgroup" = "cgroup2fs" ] && [ "$docker_cgroup" = "2" ]; then
            echo "KIND_MODES=$KIND_MODES,cilium" >> "$GITHUB_ENV"
            echo "cilium: yes, $cgroup and Docker cgroup v$docker_cgroup" | tee -a "$RUNNER_TEMP/kindcells/modes.txt"
          else
            reason="the runner has $cgroup and Docker cgroup v$docker_cgroup, and Cilium in kind needs cgroup v2"
            echo "KIND_WAITING=${KIND_WAITING:+$KIND_WAITING; }$reason" >> "$GITHUB_ENV"
            echo "cilium: no, $reason" | tee -a "$RUNNER_TEMP/kindcells/modes.txt"
          fi
      # The ambient flavor of Istio: istio-cni writes iptables rules in the network namespace of each
      # ambient pod and of each node (cni/pkg/iptables/iptables.go of Istio 1.31.3). A node container
      # uses the modules of the kernel of the runner: load each one here, and print each result. When
      # one does not load, each ambient cell waits, with the names in summary.ndjson.
      - name: The modules of istio-cni
        run: |
          missing=""
          for module in nf_tables nft_compat nf_conntrack ip_tables ip6_tables iptable_filter iptable_mangle iptable_nat iptable_raw \
              ip6table_filter ip6table_mangle ip6table_nat ip6table_raw xt_REDIRECT xt_connmark xt_conntrack xt_mark xt_owner \
              xt_tcpudp xt_multiport xt_comment xt_set ip_set ip_set_hash_ip ip_set_hash_net; do
            if sudo modprobe "$module" 2>/dev/null; then
              echo "$module: loaded" >> "$RUNNER_TEMP/kindcells/ambient.txt"
            else
              echo "$module: missing" >> "$RUNNER_TEMP/kindcells/ambient.txt"
              missing="${missing:+$missing }$module"
            fi
          done
          cat "$RUNNER_TEMP/kindcells/ambient.txt"
          waiting=""
          if [ -n "$missing" ]; then
            waiting="the kernel $(uname -r) of the runner has no module $missing for istio-cni"
          fi
          echo "ambient waiting: ${waiting:-none}" | tee -a "$RUNNER_TEMP/kindcells/ambient.txt"
          echo "KIND_AMBIENT_WAITING=$waiting" >> "$GITHUB_ENV"
      # Each kind node is a container on the kernel of the runner, thus the pods of all nodes share its
      # inotify limits. The default of 128 instances for each user is too few for a cluster with the
      # DaemonSets and the sidecars of a mesh, and a kubelet or a log stream then fails with "too many
      # open files". These are the limits that the known issues of kind give.
      - name: The inotify limits of the nodes
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
          echo "inotify: $(sysctl -n fs.inotify.max_user_instances) instances, $(sysctl -n fs.inotify.max_user_watches) watches" | tee -a "$RUNNER_TEMP/kindcells/runner.txt"
      # A dump of conntrack through netlink walks each bucket of the table of the kernel with the
      # softirqs off, and a segment that comes in that walk waits for its end. The agent of each node
      # dumps the table each second. A runner of 16 GB has 262144 buckets: the table gets 16384.
      - name: A small conntrack table
        run: |
          sudo apt-get install -y -qq conntrack >/dev/null
          sudo modprobe nf_conntrack
          listing() {
            sudo unshare --net python3 -c 'import subprocess, time
          t = []
          for _ in range(200):
              s = time.perf_counter()
              subprocess.run(["conntrack", "-L", "-p", "tcp"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              t.append((time.perf_counter() - s) * 1000)
          t.sort()
          print(f"median {t[100]:.2f} ms, max {t[-1]:.2f} ms of 200 listings")'
          }
          before="$(sudo cat /sys/module/nf_conntrack/parameters/hashsize)"
          slow="$(listing)"
          echo 16384 | sudo tee /sys/module/nf_conntrack/parameters/hashsize >/dev/null
          {
            echo "conntrack buckets: $before, then $(sudo cat /sys/module/nf_conntrack/parameters/hashsize)"
            echo "conntrack listing at $before buckets: $slow"
            echo "conntrack listing at 16384 buckets: $(listing)"
          } | tee -a "$RUNNER_TEMP/kindcells/runner.txt"
      # The border of O17 of T15 sets tcp_retries2 in the network namespace of each client pod. It must
      # be a sysctl of the namespace, not of the host. The middlebox of O03 uses the match recent in
      # the namespace of each replica. A node container uses the modules of the kernel of the runner,
      # thus this step loads xt_recent. The sysctls of conntrack and the drop of INVALID stay in the
      # check as a record of the kernel. This step tries each feature in a new namespace, and it prints
      # each result and the values of the host after it.
      - name: The kernel features of the borders
        run: |
          if sudo modprobe xt_recent; then
            echo "module xt_recent: loaded" | tee "$RUNNER_TEMP/kindcells/borders.txt"
          else
            echo "module xt_recent: no" | tee "$RUNNER_TEMP/kindcells/borders.txt"
          fi
          sudo unshare --net sh -c '
            try() { if "$@" >/dev/null 2>&1; then echo yes; else echo no; fi; }
            echo "netns conntrack timeout: $(try sysctl -w net.netfilter.nf_conntrack_tcp_timeout_established=9), now $(sysctl -n net.netfilter.nf_conntrack_tcp_timeout_established 2>&1)"
            echo "netns conntrack loose: $(try sysctl -w net.netfilter.nf_conntrack_tcp_loose=0), now $(sysctl -n net.netfilter.nf_conntrack_tcp_loose 2>&1)"
            echo "netns tcp_retries2: $(try sysctl -w net.ipv4.tcp_retries2=4), now $(sysctl -n net.ipv4.tcp_retries2 2>&1)"
            echo "netns drop of INVALID: $(try iptables -I INPUT -p tcp --dport 15008 -m conntrack --ctstate INVALID -j DROP)"
            echo "netns match recent: $(try iptables -I INPUT -p tcp --dport 15008 -m recent --name LAB-MBX --rsource --update --seconds 9 -j RETURN)"
            echo "netns table of recent: $(try test -e /proc/net/xt_recent/LAB-MBX)"
          ' | tee -a "$RUNNER_TEMP/kindcells/borders.txt"
          {
            echo "host conntrack timeout: $(sysctl -n net.netfilter.nf_conntrack_tcp_timeout_established)"
            echo "host conntrack loose: $(sysctl -n net.netfilter.nf_conntrack_tcp_loose)"
            echo "host tcp_retries2: $(sysctl -n net.ipv4.tcp_retries2)"
          } | tee -a "$RUNNER_TEMP/kindcells/borders.txt"
          if grep -q ': no' "$RUNNER_TEMP/kindcells/borders.txt"; then
            echo "::warning::a kernel feature of the borders of T15 is missing, see borders.txt"
          fi
      - name: The cells
        # a bound for a shard that does not end (SYS-43): the step fails, and the steps below still run
        timeout-minutes: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.minutes || '36') }}
        env:
          KIND_LAB: "1"
          KIND_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          KIND_OUT: ${{ runner.temp }}/kindcells
          KIND_WORK: ${{ runner.temp }}/kind-work
        run: pnpm --filter @systems/cells test
      # a job that stopped in the middle leaves its clusters: the pinned kind deletes them
      - name: Delete each cluster
        if: always()
        run: |
          kind="packages/kind/.cache/tools/kind-v0.33.0-linux-x64/kind"
          if [ -x "$kind" ]; then
            for cluster in $("$kind" get clusters 2>/dev/null); do "$kind" delete cluster --name "$cluster" || true; done
          fi
          docker network ls --format '{{.Name}}' | grep '^systems-lab-' | xargs -r docker network rm || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-${{ matrix.shard }}
          path: ${{ runner.temp }}/kindcells/
          if-no-files-found: warn
          retention-days: 30

  capture:
    if: github.event_name == 'pull_request' || inputs.capture == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner, beside the dump
        run: |
          mkdir -p "$RUNNER_TEMP/cilium-capture"
          sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
          {
            echo "kernel: $(uname -r)"
            echo "cgroup: $(stat -fc %T /sys/fs/cgroup)"
            echo "docker: $(docker version --format '{{.Server.Version}}')"
            echo "docker cgroup: $(docker info --format '{{.CgroupVersion}}')"
            echo "image: $ImageOS $ImageVersion"
          } | tee "$RUNNER_TEMP/cilium-capture/runner.txt"
      - name: The capture
        env:
          KIND_CAPTURE: ${{ runner.temp }}/cilium-capture
          KIND_WORK: ${{ runner.temp }}/kind-work
        run: pnpm --filter @mark1russell7/kind exec vitest run src/cilium.capture.test.ts
      - name: Delete each cluster
        if: always()
        run: |
          kind="packages/kind/.cache/tools/kind-v0.33.0-linux-x64/kind"
          if [ -x "$kind" ]; then
            for cluster in $("$kind" get clusters 2>/dev/null); do "$kind" delete cluster --name "$cluster" || true; done
          fi
          docker network ls --format '{{.Name}}' | grep '^systems-' | xargs -r docker network rm || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cilium-capture
          path: ${{ runner.temp }}/cilium-capture/
          if-no-files-found: warn
          retention-days: 30
