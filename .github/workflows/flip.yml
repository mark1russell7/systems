# The flip tests of the gates that read a measure (SYS-100). For each flip here, the same job operates the
# test on the copy with no fault and on a copy with one source fault of a stated size. The fault must turn
# that test red on its bound. A bound with no flip can pass for a reason that is not the measure.
# docs/ROADMAP.md names the assertions with no flip.
#
# The check itself stays in redis.yml, http.yml and process.yml. This workflow is not a required check.
# A pull request that changes a fault site or a test of a bound starts it, and a weekly run shows a rot.
# Start it with: gh workflow run flip.yml -R mark1russell7/systems
name: Flip

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # With no shell key, a step has no pipefail: `cmd | tee file` passes when cmd fails.
    shell: bash

concurrency:
  group: flip-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@fc41ae3906e671ae746e9597ccc351a4e7ce8a3b # main
        with:
          paths: |
            .github/workflows/flip.yml
            .github/actions/flip/**
            packages/service/src/redis/client.ts
            packages/service/src/redis/redis-it.test.ts
            packages/service/src/redis/f6-redis.test.ts
            packages/service/src/latch.ts
            packages/service/src/poller.ts
            packages/service/src/lifecycle.ts
            packages/service/src/http/transport.ts
            packages/service/src/http/http-it.test.ts
            packages/service/src/worker.ts
            packages/service/src/worker.test.ts
            packages/service/src/conformance.ts
            packages/service/src/host/node.ts
            packages/service/src/host-it.test.ts

  redis:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Redis OK, the request timeout (2 x the timeout, 4 s against 3.5 s)
        uses: ./.github/actions/flip
        env:
          REDIS_IT: "1"
        with:
          what: Redis OK, the request timeout, 2 x the timeout
          file: packages/service/src/redis/client.ts
          from: "commandTimeout: requestTimeout,"
          to: "commandTimeout: requestTimeout * 2,"
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/redis-it.test.ts -t "a command that the server holds fails at the request timeout"
          fails: expected [0-9.]+ to be less than 3500
      - name: Redis OK, the request timeout (half the timeout, 1 s against 1.9 s)
        uses: ./.github/actions/flip
        env:
          REDIS_IT: "1"
        with:
          what: Redis OK, the request timeout, half the timeout
          file: packages/service/src/redis/client.ts
          from: "commandTimeout: requestTimeout,"
          to: "commandTimeout: requestTimeout / 2,"
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/redis-it.test.ts -t "a command that the server holds fails at the request timeout"
          fails: |
            expected [0-9.]+ to be greater than or equal to 1900

  f6:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    # the harness's image builds its Rust injector on the runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Redis OK, the close at the shutdown (3 x the bound of the QUIT, 800 ms against 350 ms)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the close at the shutdown, 3 x the bound of the QUIT
          file: packages/service/src/redis/client.ts
          from: "withinBound(clock, ms(knobs.close_bound), c.quit())"
          to: "withinBound(clock, 3 * ms(knobs.close_bound), c.quit())"
          # the probe image installs the tarballs of quantity, algebra and service, which pack build/
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "a shutdown in the middle of a black hole"
          fails: expected [0-9.]+ to be less than or equal to 350
      # The late trips turn each of the 5 rows red. Each other fault reads the row of the reset: a reset fails a poll
      # with no wait for its timeout, thus the time of the first failure has its smallest range there
      - name: Redis OK, the trip of readiness, each manifestation (2 polls late, 4.2 s or more against 4.05 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the trip of readiness, each manifestation, 2 polls late
          file: packages/service/src/latch.ts
          from: "if (!state && fails >= timing.failAfter) set(true);"
          to: "if (!state && fails >= timing.failAfter + 2) set(true);"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "each posture trips and releases"
          fails: |
            Tests +5 failed
            readiness: tripped after [4-9][0-9]{3}[.]
      - name: Redis OK, the trip of liveness, each manifestation (2 s late, 5.8 s or more against 4.65 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the trip of liveness, each manifestation, 2 s late
          file: packages/service/src/latch.ts
          from: "const wait = ms(timing.failAfter);"
          to: "const wait = ms(timing.failAfter) + 2000;"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "each posture trips and releases"
          fails: |
            Tests +5 failed
            liveness: tripped after [5-9][0-9]{3}[.]
      - name: Redis OK, the trip of readiness, early (at the first failure, 1.2 s at the most against 1.55 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the trip of readiness, early, at the first failure
          file: packages/service/src/latch.ts
          from: "if (!state && fails >= timing.failAfter) set(true);"
          to: "if (!state && fails >= 1) set(true);"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "rst. each posture trips and releases"
          fails: |
            readiness: tripped after ([0-9]{3}|1[0-5][0-9]{2})[.]
      - name: Redis OK, the trip of liveness, early (2 s early, 2.2 s at the most against 2.95 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the trip of liveness, early, 2 s early
          file: packages/service/src/latch.ts
          from: "const wait = ms(timing.failAfter);"
          to: "const wait = ms(timing.failAfter) - 2000;"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "rst. each posture trips and releases"
          fails: |
            liveness: tripped after ([0-9]{3}|[12][0-9]{3})[.]
      - name: Redis OK, the release of readiness (6 polls late, 4.8 s or more against 4 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the release of readiness, 6 polls late
          file: packages/service/src/latch.ts
          from: "if (state && passes >= timing.recoverAfter) set(false);"
          to: "if (state && passes >= timing.recoverAfter + 6) set(false);"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "rst. each posture trips and releases"
          fails: |
            readiness: tripped after .*released after [4-9][0-9]{3}[.]
      - name: Redis OK, the release of liveness (5 s late, 5 s or more against 4 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the release of liveness, 5 s late
          file: packages/service/src/latch.ts
          from: "if (timing.recoverAfter === undefined) {"
          to: "if (timing.recoverAfter === undefined && clock.after(5000, () => set(false))) return; if (timing.recoverAfter === undefined) {"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "rst. each posture trips and releases"
          fails: |
            liveness: tripped after .*released after [5-9][0-9]{3}[.]
      - name: Redis OK, the first failure of a check that only reports (2 s late, 2 s or more against 1.65 s)
        uses: ./.github/actions/flip
        env:
          REDIS_F6: "1"
        with:
          what: Redis OK, the first failure of a check that only reports, 2 s late
          file: packages/service/src/poller.ts
          from: "void polled!.then(handle);"
          to: "void polled!.then((value) => { if (value.outcome === \"ok\") handle(value); else clock.after(2000, () => handle(value)); });"
          prepare: pnpm build
          test: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts -t "rst. each posture trips and releases"
          fails: |
            reports: first failure after [2-9][0-9]{3}[.]

  http:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fault goes in at the start. The test reads the timer and the hint before the start, thus only the real close moves
      - name: HTTP OK, the idle close (2 s late, 4 s against 2.3 s)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the idle close, 2 s late
          file: packages/service/src/http/transport.ts
          from: "async start(_signal, given) {"
          to: "async start(_signal, given) { Object.assign(server, { keepAliveTimeoutBuffer: 3000 });"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "closes an idle connection at server_idle_close"
          fails: expected [0-9.]+ to be less than or equal to 2300
      - name: HTTP OK, the idle close (1 s early, 1 s against 1.85 s)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the idle close, 1 s early
          file: packages/service/src/http/transport.ts
          from: "async start(_signal, given) {"
          to: "async start(_signal, given) { Object.assign(server, { keepAliveTimeoutBuffer: 0 });"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "closes an idle connection at server_idle_close"
          fails: |
            expected [0-9.]+ to be greater than or equal to 1850
      - name: HTTP OK, the close of an idle connection at the stop (at the first sweep, 200 ms against 150 ms)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the close of an idle connection at the stop, at the first sweep
          file: packages/service/src/http/transport.ts
          from: "if (!throughDrain()) closeListener();"
          to: "if (!throughDrain()) clock.after(sweepEvery, closeListener); const closeIdleConnections = (): void => {};"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "refuses new connections, closes idle connections at once"
          fails: |
            expected [0-9.]+ to be less than 150
      - name: HTTP OK, the sweep (3 x its interval, 600 ms against 350 ms)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the sweep, 3 x its interval
          file: packages/service/src/http/transport.ts
          from: "sweep = clock.after(sweepEvery, () => {"
          to: "sweep = clock.after(sweepEvery * 3, () => {"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "refuses new connections, closes idle connections at once"
          fails: |
            expected [0-9.]+ to be less than or equal to 350
      - name: HTTP OK, the hold of a phase (half its cap, 150 ms against 295 ms)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the hold of a phase, half its cap
          file: packages/service/src/lifecycle.ts
          from: "if (first === \"work\" && hold) await end;"
          to: "if (first === \"work\" && hold) await Promise.race([end, new Promise((half) => setTimeout(half, cap / 2))]);"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "drains a held request after SIGTERM"
          fails: |
            expected [0-9.]+ to be greater than or equal to 295
      - name: HTTP OK, the cut at the deadline of the drain (2 x the cap of a phase, 3 s against 1.65 s)
        uses: ./.github/actions/flip
        env:
          HTTP_IT: "1"
        with:
          what: HTTP OK, the cut at the deadline of the drain, 2 x the cap of a phase
          file: packages/service/src/lifecycle.ts
          from: "\n    const cap = valueIn(phase.cap, \"ms\");"
          to: "\n    const cap = valueIn(phase.cap, \"ms\") * 2;"
          test: pnpm --filter @mark1russell7/service exec vitest run src/http/http-it.test.ts -t "cuts a held request at the deadline of the drain"
          fails: |
            expected [0-9.]+ to be less than or equal to 1650
      - name: HTTP OK, the drain of a worker (1 s past its deadline)
        uses: ./.github/actions/flip
        env:
          WORKERS_IT: "1"
        with:
          what: HTTP OK, the drain of a worker, 1 s past its deadline
          file: packages/service/src/worker.ts
          from: "return running.drain(deadline, signal);"
          to: "return running.drain(deadline + 1000, signal);"
          test: pnpm --filter @mark1russell7/service exec vitest run src/worker.test.ts -t "on the real clock.*drain holds to its deadline"
          fails: drain did not end in [0-9]+ ms
      - name: HTTP OK, the drain of a worker, early (500 ms before its deadline, against 100 ms)
        uses: ./.github/actions/flip
        env:
          WORKERS_IT: "1"
        with:
          what: HTTP OK, the drain of a worker, early, 500 ms before its deadline
          file: packages/service/src/worker.ts
          from: "return running.drain(deadline, signal);"
          to: "return running.drain(deadline - 500, signal);"
          test: pnpm --filter @mark1russell7/service exec vitest run src/worker.test.ts -t "on the real clock.*drain holds to its deadline"
          fails: |
            drain ended after [0-9]+ ms, before its deadline
      - name: HTTP OK, the cooperative abort of a worker (the signal does not arrive)
        uses: ./.github/actions/flip
        env:
          WORKERS_IT: "1"
        with:
          what: HTTP OK, the cooperative abort of a worker, the signal does not arrive
          file: packages/service/src/worker.ts
          from: "return running.drain(deadline, signal);"
          to: "return running.drain(deadline, new AbortController().signal);"
          test: pnpm --filter @mark1russell7/service exec vitest run src/worker.test.ts -t "on the real clock.*drain gives the cooperative abort"
          fails: |
            the work did not get the cooperative abort
      - name: HTTP OK, the close of a worker (2 s late, against its bound of 1 s)
        uses: ./.github/actions/flip
        env:
          WORKERS_IT: "1"
        with:
          what: HTTP OK, the close of a worker, 2 s late
          file: packages/service/src/worker.ts
          from: "closing = (async () => {"
          to: "closing = (async () => { await new Promise((later) => clock.after(2000, later));"
          test: pnpm --filter @mark1russell7/service exec vitest run src/worker.test.ts -t "on the real clock.*close right after the start ends in its bound"
          fails: |
            close did not end in its bound of [0-9]+ ms

  process:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Process OK, the timeout of a command (40 x the timeout, 40 s against 30 s)
        uses: ./.github/actions/flip
        env:
          HOST_IT: "1"
        with:
          what: Process OK, the timeout of a command, 40 x the timeout
          file: packages/service/src/host/node.ts
          from: "timeout: options.timeout ?? 0, windowsHide"
          to: "timeout: (options.timeout ?? 0) * 40, windowsHide"
          test: pnpm --filter @mark1russell7/service exec vitest run src/host-it.test.ts -t "124 at the timeout"
          fails: expected [0-9.]+ to be less than 30000
      - name: Process OK, the timeout of a status read (20 x the timeout, 20 s against 15 s)
        uses: ./.github/actions/flip
        env:
          HOST_IT: "1"
        with:
          what: Process OK, the timeout of a status read, 20 x the timeout
          file: packages/service/src/host/node.ts
          from: "AbortSignal.timeout(timeout), redirect"
          to: "AbortSignal.timeout(timeout * 20), redirect"
          test: pnpm --filter @mark1russell7/service exec vitest run src/host-it.test.ts -t "null at a closed port and at a timeout"
          fails: expected [0-9.]+ to be less than 15000

  flip-ok:
    name: Flip OK
    if: always()
    needs: [changes, redis, f6, http, process]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@fc41ae3906e671ae746e9597ccc351a4e7ce8a3b # main
        with:
          needs: ${{ toJSON(needs) }}
