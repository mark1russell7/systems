# Runs the opt-in tests of the Redis client of @mark1russell7/service against a real Redis, on
# GitHub's runners. ci.yml runs the same client against the fake ioredis only.
#
#   it   REDIS_IT=1: the client against Redis 7.4 and the real ioredis 6.
#   f6   REDIS_F6=1: the F6 matrix in Docker. The probe image installs the packed packages, and the
#        injector of @mark1russell7/harness makes the network faults.
#
# A pull request that changes the Redis client, the core of the clients, the timers of the service
# or this file runs both. Start it with: gh workflow run redis.yml -R mark1russell7/systems
name: Redis

on:
  workflow_dispatch:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:

permissions:
  contents: read

concurrency:
  group: redis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@0f4ebb2e4bf2da9fd67ebbd02935e6f7b9f3ca7b # main
        with:
          paths: |
            .github/workflows/redis.yml
            packages/service/src/redis/**
            packages/service/src/client/**
            packages/service/src/redis.ts
            packages/service/src/clock.ts
            packages/service/src/heartbeat.ts
            packages/service/src/backoff.ts
            packages/service/test/f6/**

  it:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The client against Redis 7.4
        env:
          REDIS_IT: "1"
        run: pnpm --filter @mark1russell7/service exec vitest run src/redis/redis-it.test.ts

  f6:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    # the harness's image builds its Rust injector on the runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the probe image installs the tarballs of quantity, algebra and service, which pack build/
      - run: pnpm build
      - name: The F6 matrix against Redis 7.4
        env:
          REDIS_F6: "1"
        run: pnpm --filter @mark1russell7/service exec vitest run src/redis/f6-redis.test.ts

  redis-ok:
    name: Redis OK
    if: always()
    needs: [changes, it, f6]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@0f4ebb2e4bf2da9fd67ebbd02935e6f7b9f3ca7b # main
        with:
          needs: ${{ toJSON(needs) }}
