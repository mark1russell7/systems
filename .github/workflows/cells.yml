# Runs the cell catalogs on GitHub's runners. Each shard gets a runner of its own, so no other work
# on a machine loads the timers that the cells measure.
#
#   probe   Writes what the runner is: its kernel, CONFIG_HZ, BTF, CPUs and memory. The predictions
#           read the kernel's facts. Then it runs the harness's opt-in lab test: privileged
#           containers, the injector and the eBPF prober on this runner.
#   cells   Runs the cells whose names match `only`, a shard on each runner, and uploads each raw
#           record and summary.ndjson as an artifact, for the private repository to land. With `file`, the cells
#           come from that JSON file at the ref (compiled cells), not the catalogs.
#           The WS and WST cells run on the procedures subject of mark1russell7/client (CLI-33):
#           the job checks that repository out at CLIENT_REF and builds the subject of the checkout.
#           With `subject`, a subject as JSON (the harness's Subject) replaces it, for example a
#           pinned image of another release.
#           With `pair`, two versions of @mark1russell7/service, for example 0.5.6,0.6.0, the
#           rounds of the keyed limiter replace the catalogs: in each round, the A/B pair of the
#           control and the candidate, then the A/A pair of the control (SYS-52). The order of
#           each pair turns each round. The job copies the target of the limiter for each version
#           and makes its lockfile. The count of shards must divide the count of selected limiter
#           specs. Then each cell of a spec operates on the same runner, and paired.ndjson gets
#           the PairedTime records of rigor-bench.
#           With E3 in `only`, the job installs the pinned containerlab for the routers of a fabric.
#
# Start it with: gh workflow run cells.yml -R mark1russell7/systems -f only='^T12' -f shards=4
# A pair: gh workflow run cells.yml -R mark1russell7/systems -f pair=0.5.6,0.6.0 -f only='^O(29|30)[.]' -f shards=6
# A pull request that changes this file runs the probe only. Each night, the schedule runs the WS
# cells on 4 shards: the heartbeat and the reconnect of @procedures/client under real faults.
# Each Sunday, the schedule runs the RD cells on one shard: the drills of the ladder of recovery.
# The step of the locked rungs fails that run when a rung is not within its budgets.
name: Cells

on:
  workflow_dispatch:
    inputs:
      only:
        description: A regular expression of the cell names to run
        default: "."
      shards:
        description: How many runners share the cells (1 to 20)
        default: "4"
      file:
        description: A JSON file of compiled cells at the ref, in place of the catalogs (empty for the catalogs)
        default: ""
      subject:
        description: A subject as JSON, in place of the subject of its name in the catalogs (empty for the procedures subject of mark1russell7/client at CLIENT_REF)
        default: ""
      pair:
        description: Two versions of @mark1russell7/service, the control and the candidate, for example 0.5.6,0.6.0 (empty for the catalogs)
        default: ""
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 9 * * 0"
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:

permissions:
  contents: read

env:
  # the commit of mark1russell7/client whose procedures subject the WS and WST cells run:
  # @procedures/client 0.22.0 and two PATCHes after it (packages/cells/src/subjects.ts holds the same)
  CLIENT_REF: 2408cea460d84dc7577b69c4ae68a559f2dc2bdd

# The runs of a pull request share a group, and a newer push cancels the older run. Each dispatch and each
# schedule has a group of its own. GitHub keeps only one waiting run of a group, so a shared group cancels a
# dispatch of other cells.
# With no shell key, a step has no pipefail: `cmd | tee file` passes when cmd fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@f48f29fe5b00772951e0910a90fbbe312343338c # main
        with:
          paths: |
            .github/workflows/cells.yml

  probe:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    # the lab builds the harness's images on the runner, the Rust one among them
    timeout-minutes: 60
    steps:
      - name: The runner
        run: |
          echo "kernel: $(uname -r)"
          echo "CONFIG_HZ: $(grep -E '^CONFIG_HZ=' "/boot/config-$(uname -r)" || echo unknown)"
          if [ -e /sys/kernel/btf/vmlinux ]; then echo "BTF: yes"; else echo "BTF: no"; fi
          # libuv reads the coarse clock (id 6) when its step is 1 ms or less: the Node timers' bands read it
          echo "CLOCK_MONOTONIC_COARSE: $(python3 -c 'import time; print(time.clock_getres(6))') s"
          echo "cpus: $(nproc)"
          free -m
          docker version --format 'docker: {{.Server.Version}}'
      # a fresh network namespace starts at the kernel's compiled defaults, as each cell's does
      - name: The defaults of a fresh network namespace
        run: |
          sudo unshare --net sh -c 'for knob in tcp_keepalive_time tcp_keepalive_intvl tcp_keepalive_probes tcp_retries1 tcp_retries2 tcp_syn_retries tcp_syn_linear_timeouts tcp_fin_timeout tcp_rto_min_us tcp_rto_max_ms tcp_mtu_probing; do echo "net.ipv4.$knob: $(sysctl -n net.ipv4.$knob 2>/dev/null || echo absent)"; done'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the lab test of the procedures WebSocket client builds the subject of the client repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/client
          ref: ${{ env.CLIENT_REF }}
          path: client
          persist-credentials: false
      # the output of each lab test stays in the log: the memory of the runner with a replica set of three.
      # A lab test that fails runs once more, and the log keeps the first failure. In run 39178402327, one
      # run of the lab of Pgpool-II found no end of its idle client, and no cell of the run started
      - name: The harness's lab test
        env:
          HARNESS_LAB: "1"
          HARNESS_PROCEDURES: ${{ github.workspace }}/client
        run: pnpm --filter @mark1russell7/harness exec vitest run --silent=false --retry=1
      # the error of a failed build holds its error lines and its last lines: this step gives the whole log
      - name: The images of the harness that do not build, after a failure
        if: failure()
        run: |
          # the context of each image is packages/, as the lab gives it (src/image.ts)
          for dockerfile in packages/harness/image/Dockerfile packages/harness/image/*/Dockerfile; do
            dir="$(dirname "$dockerfile")"
            if ! docker build --progress=plain -f "$dockerfile" packages > /tmp/build.log 2>&1; then
              echo "::group::$dir does not build"
              tail -n 80 /tmp/build.log
              echo "::endgroup::"
            fi
          done
      # what the kernel says when the prober cannot load: the verifier's log goes to its stderr
      - name: The prober on its own, after a failure
        if: failure()
        run: |
          image="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^loom-harness:' | head -n 1 || true)"
          echo "image: $image"
          if [ -n "$image" ]; then
            timeout 20 docker run --rm --privileged --network none "$image" /opt/harness/prober "$(stat -Lc %i /proc/self/ns/net)" 2>&1 | head -n 400 || true
          fi
          echo "lockdown: $(cat /sys/kernel/security/lockdown 2>/dev/null || echo unknown)"
          sysctl kernel.unprivileged_bpf_disabled kernel.perf_event_paranoid kernel.kptr_restrict 2>&1 || true
          sudo dmesg | tail -n 40 || true

  plan:
    needs: changes
    if: ${{ needs.changes.outputs.match == 'true' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      # each shard makes the lockfiles of a pair from the npm registry as it was at this time
      at: ${{ steps.at.outputs.at }}
    steps:
      - id: at
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || (github.event.schedule == '30 9 * * 0' && '1' || '4') }}
        run: |
          case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a whole number"; exit 1 ;;
          esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be 1 to 20"; exit 1
          fi
          echo "list=$(seq -s, 0 $((SHARDS - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  cells:
    needs: [changes, probe, plan]
    if: ${{ needs.changes.outputs.match == 'true' && (github.event_name != 'pull_request') }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner, beside the records
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          {
            echo "kernel: $(uname -r)"
            # one image can start on each cloud: the vendor tells which, and the name of the kernel does not
            echo "vendor: $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || echo unknown)"
            if [ -e /dev/kvm ]; then echo "kvm: yes"; else echo "kvm: no"; fi
            echo "CONFIG_HZ: $(grep -E '^CONFIG_HZ=' "/boot/config-$(uname -r)" || echo unknown)"
            echo "CLOCK_MONOTONIC_COARSE: $(python3 -c 'import time; print(time.clock_getres(6))') s"
            echo "cpus: $(nproc)"
            # the speed of the CPU moves the time of a program on its first reply (the HTTP calibration)
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p' | head -n 1)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MiB"
            echo "image: $ImageOS $ImageVersion"
          } | tee "$RUNNER_TEMP/cells/runner.txt"
      # The router of a middlebox lists the conntrack table each 50 to 100 ms to evict its expired
      # flows. A listing walks each bucket of the table of the kernel with the softirqs off, and a
      # segment that comes in that walk waits for its end. A runner of 16 GB has 262144 buckets: in
      # the run 39057994070, one reply through the router waited 6.8 ms. The table gets 16384.
      - name: A small conntrack table
        run: |
          sudo apt-get install -y -qq conntrack >/dev/null
          sudo modprobe nf_conntrack
          listing() {
            sudo unshare --net python3 -c 'import subprocess, time
          t = []
          for _ in range(200):
              s = time.perf_counter()
              subprocess.run(["conntrack", "-L", "-p", "tcp"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              t.append((time.perf_counter() - s) * 1000)
          t.sort()
          print(f"median {t[100]:.2f} ms, max {t[-1]:.2f} ms of 200 listings")'
          }
          before="$(sudo cat /sys/module/nf_conntrack/parameters/hashsize)"
          slow="$(listing)"
          echo 16384 | sudo tee /sys/module/nf_conntrack/parameters/hashsize >/dev/null
          {
            echo "conntrack buckets: $before, then $(sudo cat /sys/module/nf_conntrack/parameters/hashsize)"
            echo "conntrack listing at $before buckets: $slow"
            echo "conntrack listing at 16384 buckets: $(listing)"
          } | tee -a "$RUNNER_TEMP/cells/runner.txt"
      # the procedures subject of the client repository, at CLIENT_REF, or the subject of the input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/client
          ref: ${{ env.CLIENT_REF }}
          path: client
          persist-credentials: false
      - name: The procedures subject
        env:
          GIVEN: ${{ inputs.subject }}
        run: |
          if [ -n "$GIVEN" ]; then
            printf '%s' "$GIVEN" | jq . > "$RUNNER_TEMP/subject.json"
          else
            jq --arg context "$GITHUB_WORKSPACE/client" '.image.context = $context' client/harness/procedures-subject/subject.json > "$RUNNER_TEMP/subject.json"
          fi
          echo "subject: $(jq -c . "$RUNNER_TEMP/subject.json")" | tee -a "$RUNNER_TEMP/cells/runner.txt"
      # the input pair: a copy of the target of the limiter for each version, with its version of the
      # service in package.json, and a lockfile from the registry at the time of the plan job
      - name: The targets of the limiter pair
        if: inputs.pair != ''
        env:
          PAIR: ${{ inputs.pair }}
          AT: ${{ needs.plan.outputs.at }}
        run: |
          target=packages/cells/targets/service-limiter
          for version in $(printf '%s' "$PAIR" | tr ',' ' '); do
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
              echo "::error::the pair takes two versions, for example 0.5.6,0.6.0"; exit 1
            fi
            dir="$RUNNER_TEMP/limiter-pair/$version"
            mkdir -p "$dir"
            cp "$target/Dockerfile" "$target/server.mjs" "$target/spec.mjs" "$target/declaration.mjs" "$dir/"
            jq --arg version "$version" '.dependencies["@mark1russell7/service"] = $version' "$target/package.json" > "$dir/package.json"
            (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before "$AT" && mv package-lock.json npm-lock.json)
            echo "pair $version: $(jq -c '[.packages | to_entries[] | select(.key != "") | {key: (.key | sub("^node_modules/"; "")), value: .value.version}] | from_entries' "$dir/npm-lock.json")" | tee -a "$RUNNER_TEMP/cells/runner.txt"
          done
      # the routers of layer E3 come from containerlab: only a run that asks for its cells pays for it
      - name: The pinned containerlab
        if: contains(inputs.only, 'E3')
        run: |
          deb=containerlab_0.82.0_linux_amd64.deb
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://github.com/srl-labs/containerlab/releases/download/v0.82.0/$deb"
          echo "770e18f19ef75732eb9f4e362541f509abb2b6eeadde2d5c98140190b19b519a  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo apt-get install -y -qq "$RUNNER_TEMP/$deb"
          echo "containerlab: $(containerlab version | sed -n 's/^ *version: *//p')" | tee -a "$RUNNER_TEMP/cells/runner.txt"
      - name: The cells
        env:
          CELLS: "1"
          # a schedule has no inputs: the night runs the WS cells, and the Sunday runs the RD cells
          CELLS_ONLY: ${{ inputs.only || (github.event.schedule == '30 9 * * 0' && '^RD[.]' || '^WS') }}
          CELLS_SHARD: ${{ matrix.shard }}/${{ inputs.shards || (github.event.schedule == '30 9 * * 0' && '1' || '4') }}
          CELLS_OUT: ${{ runner.temp }}/cells
          CELLS_FILE_AT: ${{ inputs.file }}
          CELLS_PAIR: ${{ inputs.pair }}
          CELLS_PAIR_DIR: ${{ runner.temp }}/limiter-pair
        run: |
          if [ -n "$CELLS_FILE_AT" ]; then export CELLS_FILE="$GITHUB_WORKSPACE/$CELLS_FILE_AT"; fi
          CELLS_SUBJECT="$(cat "$RUNNER_TEMP/subject.json")"
          export CELLS_SUBJECT
          # the catalogs' bands read the runner kernel's own HZ
          CELLS_HZ="$(sed -n 's/^CONFIG_HZ=//p' "/boot/config-$(uname -r)")"
          if [ -z "$CELLS_HZ" ]; then echo "::error::the runner's kernel config gives no CONFIG_HZ"; exit 1; fi
          export CELLS_HZ
          pnpm --filter @systems/cells exec vitest run src/run.test.ts
      # A failing cell of a manual run is a finding, thus it does not fail this workflow. The night claims
      # that its cells hold: this step judges each record again, and it fails unless each cell of the shard
      # has a record and holds. In the same job, its flip test turns the check red with an injected fault
      # and with a record gone, and the clean copy stays green.
      - name: The cells of the night hold
        if: ${{ github.event.schedule == '30 3 * * *' || (inputs.only == '^WS' && inputs.shards == '4') }}
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec tsx packages/site/scripts/held.ts --flip --cells night --shard "$SHARD/4" "$RUNNER_TEMP/cells"
      # A lost rung fails this workflow too: this step reads the records of the drills again, and it fails
      # when a rung is not within its budgets, or when a drill has no record.
      - name: The locked rungs of recovery
        if: ${{ github.event.schedule == '30 9 * * 0' || (inputs.only == '^RD[.]' && inputs.shards == '1') }}
        run: pnpm exec tsx packages/site/scripts/recovery.ts --check --run "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" "$RUNNER_TEMP/cells"
      # the error of a failed build of a cell holds its error lines and its last lines: this step gives the whole log
      - name: The images of the harness that do not build, after a failure
        if: failure()
        run: |
          for dockerfile in packages/harness/image/Dockerfile packages/harness/image/*/Dockerfile; do
            dir="$(dirname "$dockerfile")"
            if ! docker build --progress=plain -f "$dockerfile" packages > /tmp/build.log 2>&1; then
              echo "::group::$dir does not build"
              tail -n 80 /tmp/build.log
              echo "::endgroup::"
            fi
          done
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cells-${{ matrix.shard }}
          path: ${{ runner.temp }}/cells/
          if-no-files-found: warn
          retention-days: 30

  cells-ok:
    name: Cells OK
    if: always()
    needs: [changes, probe, plan, cells]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@f48f29fe5b00772951e0910a90fbbe312343338c # main
        with:
          needs: ${{ toJSON(needs) }}
          allow-skip: plan cells
