# The gates of each change. release.yml calls this workflow before it packs a release.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The build that npm gets, for each package that the repository publishes
      - run: pnpm build
      # The tarballs of a release, tested in an empty project as release.yml tests them
      - run: node scripts/release/pack.mjs "$RUNNER_TEMP/release"
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/release"
      # The site, as pages.yml builds it for GitHub Pages: a page that does not build fails here, before it reaches main
      - run: pnpm --filter @systems/site run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
