# The gates of each change. release.yml calls this workflow before it packs a release.
#
#   checks  The shared CI of mark1russell7 (reusable-ci.yml of the template, its CI.md): the
#           typecheck, the tests, the build of each published package, the API reports and the writing rules.
#   pack    The tarballs of a release, packed and tested in an empty project, as release.yml does it
#           (reusable-release-build.yml of the template, with the release scripts of the template).
#   site    The conventions check (check:conventions), and the site, as pages.yml builds it for GitHub Pages.
#   checker The format, the vet and the tests of the checker of linearizability, in Go.
#   native  The build and the tests of the native programs of the harness, in Rust.
#   ci      The required check of main. It fails when a different job of this file fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # This pin is later than the other pins of the template: it has the coverage of each push to main
    # (template#263). The release build keeps the pin of release.yml.
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
    permissions:
      contents: read
    with:
      # typecheck and test: each package of the workspace.
      # build: the build that npm gets, for each package that the repository publishes.
      # check:api: the report of the API of each public package (test/api/public-api.txt), against the build.
      # lint:ste: the writing rules (ASD-STE100) of the README files and the doc comments.
      scripts: typecheck test build check:api lint:ste
      # The coverage of each package, on each pull request and each push to main. The Vitest config of a package
      # reads its floors from coverage-floors.json (SYS-109), thus a package under a floor fails the run.
      coverage: true

  # The tarballs of a release, tested in an empty project as release.yml tests them. The commit of a
  # pull request is not on main, so the job does not do the check of main (require-main).
  # In a release, release.yml calls this file, and its build job does the same pack and test. Thus
  # this job runs only in a run of CI itself: two jobs of one run cannot upload the artifact "release".
  pack:
    if: github.workflow == 'CI'
    uses: mark1russell7/template/.github/workflows/reusable-release-build.yml@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
    permissions:
      contents: read
    with:
      require-main: false
      after-pack: node scripts/smoke.mjs "$RELEASE_DIR"

  # The site, as pages.yml builds it for GitHub Pages: a page that does not build fails here, before it reaches main
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so that check:conventions reads each commit of a pull request
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The conventions of the repositories of mark1russell7 (@mark1russell7/conventions). The job checks out
      # the whole repository, so it examines them. The jobs checks and pack come from the template.
      - run: pnpm check:conventions
      - run: pnpm --filter @systems/site run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  # The checker of linearizability (packages/cells/checkers/linearizability): its format, its vet and
  # its tests, with the Go of the images of the harness, pinned by digest. Go downloads Porcupine and
  # checks it against go.sum.
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format, vet and tests
        run: >-
          docker run --rm -e CGO_ENABLED=0
          -v "$PWD/packages/cells/checkers/linearizability:/src" -w /src
          golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
          sh -c 'test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }; go vet ./... && go test -count=1 ./...'

  # The tests of the native programs of the harness. The Rust is that of the harness image: the
  # same Alpine, pinned by digest, with its packages rust and cargo. The image build of the cells
  # runs these tests too, but a pull request starts no image build. The prober's library builds
  # without its collector, thus without libbpf.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and tests
        run: >-
          docker run --rm -v "$PWD/packages:/src" -w /src/harness/image/native
          alpine:3.23@sha256:865b95f46d98cf867a156fe4a135ad3fe50d2056aa3f25ed31662dff6da4eb62
          sh -c 'apk add --no-cache rust cargo > /dev/null && cargo test --locked'

  # The required check of main (the ruleset ci-required). Its name stays "ci". It fails when a job
  # fails or stops. The job pack can be skipped only in a release run.
  ci:
    if: ${{ !cancelled() }}
    needs: [checks, pack, site, checker, native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          PACK: ${{ needs.pack.result }}
          SITE: ${{ needs.site.result }}
          CHECKER: ${{ needs.checker.result }}
          NATIVE: ${{ needs.native.result }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          echo "checks: $CHECKS, pack: $PACK, site: $SITE, checker: $CHECKER, native: $NATIVE"
          test "$CHECKS" = success
          test "$SITE" = success
          test "$CHECKER" = success
          test "$NATIVE" = success
          if [ "$WORKFLOW" = CI ]; then test "$PACK" = success; else test "$PACK" = skipped; fi
