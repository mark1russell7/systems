# The gates of each change. release.yml calls this workflow before it packs a release.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The build that npm gets, for each package that the repository publishes
      - run: pnpm build
      # The tarballs of a release, tested in an empty project as release.yml tests them
      - run: node scripts/pack.mjs "$RUNNER_TEMP/release"
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/release"
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
