# Starts the proof of the connection modes of the client load of the harness (HARNESS_LOAD=1) on GitHub's runners. The
# test opens a lab with a Node server that numbers each connection and counts the requests in its handlers on each
# connection. One client sends six streams to it: a pipeline, a pool of 8, a fresh connection for each arrival, a pool of 1
# that makes a queue, and a slow and a fast request in turn on a pipeline and on a pool. The test compares the
# connections, the requests in flight, the latencies and the lags of each stream to the bounds of its mode. The lab needs
# Docker and privileged containers. Thus the proof operates only here.
#
# The job builds the image of the harness, runs src/load-connections.test.ts, and uploads the record of the run (the
# summary, the lines of the client and the lines of the server) as the artifact load-records.
#
# A pull request that changes the client load, its plan, the lab or this file starts it. Start it by hand with:
#   gh workflow run load.yml -R mark1russell7/systems --ref <branch>
name: Load

on:
  workflow_dispatch:
  # Each pull request starts this workflow. Thus the summary check of the gate is always present. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/load.yml"
      - "packages/harness/src/load.ts"
      - "packages/harness/src/load-connections.test.ts"
      - "packages/harness/src/lab.ts"
      - "packages/harness/image/Dockerfile"
      - "packages/harness/image/native/**"

permissions:
  contents: read

# A pull request and a dispatch share a group with the later workflows of their ref. A later one cancels an earlier one.
# A push to main cancels nothing.
concurrency:
  group: load-${{ github.event_name != 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
        with:
          paths: |
            .github/workflows/load.yml
            packages/harness/src/load.ts
            packages/harness/src/load-connections.test.ts
            packages/harness/src/lab.ts
            packages/harness/image/Dockerfile
            packages/harness/image/native/**

  load:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    # the lab builds the image of the harness on the runner, with its programs in Rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image builds once in the step. The log keeps the line of the test with the numbers of the run.
      - name: The connection modes of the client load on real containers
        env:
          HARNESS_LOAD: "1"
          HARNESS_LOAD_OUT: ${{ runner.temp }}/load-records
        run: pnpm --filter @mark1russell7/harness exec vitest run src/load-connections.test.ts --silent=false
      # the error of a failed build holds its error lines and its last lines: this step gives the end of the whole log
      - name: The image of the harness when it does not build, after a failure
        if: failure()
        run: |
          # the context of the image is packages/, as the lab gives it (src/image.ts)
          if ! docker build --progress=plain -f packages/harness/image/Dockerfile packages > /tmp/build.log 2>&1; then
            tail -n 120 /tmp/build.log
          fi
      - name: The record of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-records
          path: ${{ runner.temp }}/load-records
          if-no-files-found: warn

  load-ok:
    name: Load OK
    if: ${{ !cancelled() }}
    needs: [changes, load]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
        with:
          needs: ${{ toJSON(needs) }}
