# Takes a screenshot of each page of the site at a phone width (390 px) and a desktop width (1280 px),
# in light and in dark, and uploads them with a report: each page that is wider than its screen, the
# elements that make it wider, and each error of a page. The visual checks of the site run here and not
# on a local machine, because the shared machine has little free memory.
#
# Start it with: gh workflow run site-shots.yml -R mark1russell7/systems --ref <branch>
name: Site shots

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
        with:
          paths: |
            packages/site/**
            .github/workflows/site-shots.yml

  shots:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site as pages.yml builds it, at the base that GitHub Pages serves
      - run: pnpm --filter @systems/site run build
        env:
          SITE_BASE: /systems
          ASTRO_TELEMETRY_DISABLED: "1"
      # Only this job uses Playwright, thus it stays out of the lockfile of the repository
      - name: Playwright and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: The shots
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: node packages/site/scripts/shots.mjs packages/site/dist "$RUNNER_TEMP/shots"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-shots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: warn
          retention-days: 14

  site-shots-ok:
    name: Site shots OK
    if: ${{ !cancelled() }}
    needs: [changes, shots]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
        with:
          needs: ${{ toJSON(needs) }}
