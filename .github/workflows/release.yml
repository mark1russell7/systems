# Publishes each @mark1russell7 package whose version npm does not have.
#
#   verify    The gates of ci.yml.
#   build     Builds and packs each package (scripts/pack.mjs), and tests the tarballs as an
#             application installs them (scripts/smoke.mjs).
#   publish   Publishes each tarball that npm does not have. Only this job holds "id-token: write",
#             and it runs no code of the repository: no checkout, no install, no build.
#
# A release: change the version in the package.json of a package, and push to main.
#
# npm trusted publishing uses the OIDC token of GitHub Actions. Thus the workflow needs no npm
# token, and each version gets a provenance statement. On npmjs.com the trusted publisher of each
# package names the repository mark1russell7/systems and the workflow file release.yml. npm trusts a
# workflow only for a package that exists, thus the first version of a new package goes out by hand.
# For a package that npm does not have, this workflow gives a warning and publishes nothing.
name: Release

on:
  push:
    branches: [main]
    paths: ["packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build, pack and test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/pack.mjs "$RUNNER_TEMP/release"
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: npm is 11.5.1 or later
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version cannot do trusted publishing. It must be 11.5.1 or later."
            exit 1
          fi
          echo "npm $npm_version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # packages.txt has one line for each tarball, "name version file", in the sequence of their
      # dependencies. npm publishes each tarball as it is, with no package scripts.
      - name: Publish
        run: |
          while read -r name version file; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name $version is on npm."
            elif npm view "$name" name >/dev/null 2>&1; then
              npm publish "release/$file" --access public --provenance
            else
              echo "::warning::$name is not on npm. Publish its first version by hand, then add release.yml as its trusted publisher."
            fi
          done < release/packages.txt
