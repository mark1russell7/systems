# Publishes each @mark1russell7 package whose version npm does not have (RELEASING.md, and CI.md of
# the template).
#
#   verify    The gates of ci.yml.
#   build     reusable-release-build.yml of the template: stops when the commit is not on main,
#             builds and packs each published package (scripts/release/pack.mjs), and tests the
#             tarballs as an application installs them (scripts/smoke.mjs, the input after-pack).
#   publish   The npm-publish action of the template: publishes each tarball whose version npm does
#             not have. Only this job holds "id-token: write", and it runs no code of the
#             repository: no checkout, no install, no build.
#
# This repository makes no git tags and no GitHub releases: this file has no tag job. The build job
# still writes the plan of the tags (scripts/release/tags.mjs), so a tag job can come later.
#
# The publish job stays in this file. Only its steps are shared (the npm-publish action). npm
# trusted publishing matches the OIDC token of the run to the trusted publisher of each package:
# this repository and the workflow file release.yml. A shared workflow of a different repository can
# change what npm sees (CI.md of the template). A composite action runs in this job, so npm sees
# this file. The other jobs need no OIDC token, so they are shared workflows of the template.
# Renovate does not change this file: the release session moves its pins (RELEASING.md).
#
# A release: change the version in the package.json of a package, and merge it to main. The
# workflow also starts by hand (workflow_dispatch), for example to publish again after a failure.
# It skips each version that is already on npm. A release publishes only a commit on main: the
# first step of the build job stops a run on a commit that main does not have (RELEASING.md).
#
# npm trusted publishing uses the OIDC token of GitHub Actions: no npm token, and each version
# gets a provenance statement. On npmjs.com the trusted publisher of each package names the
# repository mark1russell7/systems and the workflow file release.yml, with NO environment. A version
# with a hyphen (1.2.0-rc.1) gets the dist-tag "next". The others get "latest".
#
# npm trusts a workflow only for a package that exists. Thus the first version of a new package
# goes out by hand, or with scripts/release/npm-bootstrap.mjs (RELEASING.md). For a package that
# npm does not have, this workflow gives a warning and publishes nothing (new-packages: warning).
name: Release

on:
  push:
    branches: [main]
    paths: ["packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build, pack and test
    needs: verify
    uses: mark1russell7/template/.github/workflows/reusable-release-build.yml@6eea1cec8bcfb62ebe6af7a0d555464c961125c7 # main
    permissions:
      contents: read
    with:
      # The root build script builds each @mark1russell7 package. The smoke test installs the
      # tarballs in an empty project, as an application gets them.
      after-pack: node scripts/smoke.mjs "$RELEASE_DIR"

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    outputs:
      # The versions that this run published, "name@version" with a space between them
      published: ${{ steps.publish.outputs.published }}
    steps:
      # The action of the template, pinned to a commit. It runs in this job, so the OIDC token names
      # this repository and release.yml. It downloads the artifact "release" and publishes each
      # version that npm does not have, with provenance (.github/actions/npm-publish of the template).
      - id: publish
        uses: mark1russell7/template/.github/actions/npm-publish@6eea1cec8bcfb62ebe6af7a0d555464c961125c7 # main
        with:
          # A package that is not on npm gets a warning, and the run does not fail.
          new-packages: warning
