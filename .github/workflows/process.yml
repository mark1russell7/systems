# Runs the opt-in tests of the IPC trigger of @mark1russell7/service (SYS-21) on real child
# processes, on Linux and on Windows. Windows cannot give a child a SIGTERM that the child can catch,
# thus a parent sends the IPC message "shutdown", and the child stops through its staged shutdown.
# A control shows the difference: a SIGTERM of the parent stops the child in stages only on Linux.
# ci.yml runs the same trigger on the fake process only.
#
# These tests start real processes, thus they run only here.
# A pull request that changes the service package or this file runs them.
# Start it with: gh workflow run process.yml -R mark1russell7/systems
name: Process

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/process.yml"
      - "packages/service/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/process.yml"
      - "packages/service/**"

permissions:
  contents: read

concurrency:
  group: process-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    name: process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Node strips the types of the source, thus the child runs with no build
      - name: A child under run() and the IPC message of its parent
        env:
          PROCESS_IT: "1"
        run: pnpm --filter @mark1russell7/service exec vitest run src/process-it.test.ts
