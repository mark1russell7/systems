# Runs the opt-in tests of the IPC trigger of @mark1russell7/service (SYS-21) on real child
# processes, on Linux and on Windows. Windows cannot give a child a SIGTERM that the child can catch,
# thus a parent sends the IPC message "shutdown", and the child stops through its staged shutdown.
# A control shows the difference: a SIGTERM of the parent stops the child in stages only on Linux.
# ci.yml runs the same trigger on the fake process only.
#
# The same job runs the host entry on the real ports of Node (SYS-47): processes, the lock, the
# discovery file, the network probes, the group supervisor and a real Windows task or systemd user unit.
# The unit tests of the host entry use the fake host only.
#
# These tests start real processes, thus they run only here.
# A pull request that changes the service package or this file runs them.
# Start it with: gh workflow run process.yml -R mark1russell7/systems
name: Process

on:
  workflow_dispatch:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/process.yml"
      - "packages/service/**"

permissions:
  contents: read

concurrency:
  group: process-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@35488f7ab12bb5d452fe8307ebb05f77bb3f0f6f # main
        with:
          paths: |
            .github/workflows/process.yml
            packages/service/**

  process:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Node strips the types of the source, thus the child runs with no build
      - name: A child under run() and the IPC message of its parent
        env:
          PROCESS_IT: "1"
        run: pnpm --filter @mark1russell7/service exec vitest run src/process-it.test.ts
      # The install test of SYS-47 needs a systemd user manager. Linger starts it for the user of the runner.
      - name: A systemd user manager for the install test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          uid="$(id -u)"
          for _ in $(seq 1 30); do test -S "/run/user/$uid/bus" && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          if XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment > /dev/null; then
            echo "The systemd user manager runs."
          else
            echo "The systemd user manager does not run. The install test skips, and it tells why."
          fi
      - name: The host entry on the real ports of Node (SYS-47)
        if: ${{ !cancelled() }}
        env:
          HOST_IT: "1"
        run: pnpm --filter @mark1russell7/service exec vitest run src/host-it.test.ts

  process-ok:
    name: Process OK
    if: always()
    needs: [changes, process]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@35488f7ab12bb5d452fe8307ebb05f77bb3f0f6f # main
        with:
          needs: ${{ toJSON(needs) }}
